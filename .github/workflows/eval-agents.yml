# Harness evals, agents tier — the Claude Code harness itself (@devdigest/evals):
# the subagents under .claude/agents/. Model-backed, on OpenRouter, so it runs
# only for a PR that touches the harness and only the suites that change reaches
# (evals/scripts/ci-detect.mjs). A changed agent with no written evals is logged
# as SKIP, never failed.
#
# Jobs:
#  - agents: tool tier, through the LiteLLM proxy (evals/proxy/) that
#    translates the Agent SDK's Anthropic wire format. Reported but NOT blocking
#    (continue-on-error): the cases were calibrated on Claude models and their
#    pass rate on the model below has not been measured yet.
#
# Models are the `env` block. To switch one: edit the default here, set a
# repository variable of the same name (Settings → Secrets and variables →
# Actions → Variables), or pass the input on a manual run.
#
# Needs the OPENROUTER_API_KEY secret. Without it (a fork PR gets no secrets)
# the model jobs are skipped with a warning.
name: eval-agents

on:
  pull_request:
    paths:
      - '.claude/**'
      - '**/CLAUDE.md'
      - '**/AGENTS.md'
      # Docs the workflow cases expect a session to read; evals/src/ci-detect.test.ts
      # fails when a case names one that is missing here.
      - 'TESTING.md'
      - 'client/docs/findings-surfaces.md'
      - 'server/docs/pr-list-read-model.md'
      - 'evals/**'
      - '.github/workflows/eval-agents.yml'
  workflow_dispatch:
    inputs:
      agents_model:
        description: OpenRouter slug for the agents tier
        type: string
      judge_model:
        description: OpenRouter slug for the judge
        type: string

env:
  EVAL_MODEL_AGENTS: ${{ inputs.agents_model || vars.EVAL_MODEL_AGENTS || 'deepseek/deepseek-v4-flash' }}
  EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'deepseek/deepseek-v4-flash' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agents: ${{ steps.detect.outputs.agents }}
      has_key: ${{ steps.key.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A manual run has no base to diff against, so it runs every suite.
      - id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA...HEAD")"
            export CHANGED_FILES
          else
            export RUN_ALL=true
          fi
          node evals/scripts/ci-detect.mjs

      - id: key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=eval-agents::OPENROUTER_API_KEY is not set (missing secret, or a fork PR): the model-backed eval jobs are skipped."
          fi

  agents:
    name: agent · ${{ matrix.agent }}
    needs: detect
    if: needs.detect.outputs.has_key == 'true' && needs.detect.outputs.agents != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.detect.outputs.agents) }}
    defaults:
      run:
        working-directory: evals
    env:
      EVAL_BACKEND: openrouter
      OPENROUTER_BASE_URL: http://localhost:4000
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Start the LiteLLM proxy
        run: pnpm proxy:up

      # One session at a time, one retry: OpenRouter throttles back-to-back tool
      # sessions, and a throttled one degrades to a single turn. The test timeout
      # is twice the package default: one case took 51 s and 342 s on the same
      # model an hour apart, and passed every practice both times.
      - name: Run evals
        env:
          EVAL_MODEL: ${{ env.EVAL_MODEL_AGENTS }}
          AGENT: ${{ matrix.agent }}
        run: pnpm exec vitest run "agents/$AGENT/" --no-file-parallelism --retry 1 --testTimeout 480000

      - name: Proxy logs
        if: failure()
        run: docker compose -f proxy/docker-compose.yml logs --tail 100

      - name: Stop the proxy
        if: always()
        run: pnpm proxy:down

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-agents-${{ matrix.agent }}
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 14
